spring:
  datasource:
    # [H2 Configuration]
    # TODO : 배포 시 제거하거나 프로필 분리(local/prod) 필요
    url: jdbc:h2:mem:progbe;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

    # [MySQL Configurations]
    # TODO : 실제 DB 연결 시 주석 해제 및 환경변수 설정 확인
    # url: jdbc:mysql://localhost:3306/progbe?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
    # username: ${DB_USERNAME}
    # password: ${DB_PASSWORD}
    # driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # TODO: MySQL로 마이그레이션 시 수정
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # TODO: 배포 시 Validate | None으로 수정 - 혹은 프로필 분리(local/prod)
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    # H2 Console (http://localhost:8080/h2-console)
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # TODO: [중요] 프론트엔드(React)에서 인가 코드를 요청할 때 쓴 Redirect URI와 "정확히 일치"해야 합니다.
            # 예: http://localhost:3000/oauth/callback (개발 환경)
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # TODO: 프론트엔드 Redirect URI와 일치시킬 것
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
            client-name: Naver

        # FIXME: AuthService가 아래 Provider 쓰도록
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: ${JWT_SECRET_KEY}
  # Access Token = 30분
  access-expiration: 1800000
  # Refresh Token = 2주
  refresh-expiration: 1209600000